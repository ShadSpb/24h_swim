version: '3.8'

services:
  swimtrack_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 24swim.de_backend
    restart: unless-stopped
    environment:
      SWIMTRACK_HOST: 0.0.0.0
      SWIMTRACK_PORT: 5000
      SWIMTRACK_DB: /data/swimtrack.db
      # Mailgun (read from .env on the host; never commit values to the repo)
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_BASE_URL: ${MAILGUN_BASE_URL:-https://api.eu.mailgun.net/v3}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      APP_URL: ${APP_URL:-https://24swim.de}
    volumes:
      - type: bind
        source: /data
        target: /data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      # Internal bridge first → its gateway becomes the container's default
      # route, which gives the backend a working outbound NAT (Docker installs
      # MASQUERADE for compose-managed bridges automatically). The
      # nginx-network is still attached so the reverse proxy and the frontend
      # can reach the backend at 10.200.0.9 as before.
      egress:
      nginx:
        ipv4_address: 10.200.0.9

  swimtrack:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 24swim.de_frontend
    restart: unless-stopped
    depends_on:
      swimtrack_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      nginx:
        ipv4_address: 10.200.0.8

networks:
  nginx:
    name: nginx-network
    external: true
  # Compose-managed bridge dedicated to backend outbound traffic
  # (Mailgun API, future webhooks). Subnet is auto-allocated by Docker.
  egress:
    driver: bridge
