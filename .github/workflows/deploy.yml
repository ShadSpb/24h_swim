name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch/tag to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_branch }}
      # Runtime secrets forwarded to the server's docker-compose .env file.
      # Empty values are skipped, so docker-compose's `${VAR:-default}` syntax
      # keeps working for anything you haven't set in GitHub Secrets.
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
      MAILGUN_BASE_URL: ${{ secrets.MAILGUN_BASE_URL }}
      MAILGUN_FROM: ${{ secrets.MAILGUN_FROM }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_REF,MAILGUN_API_KEY,MAILGUN_DOMAIN,MAILGUN_BASE_URL,MAILGUN_FROM,APP_URL
          script: |
            set -euo pipefail

            : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
            : "${DEPLOY_REF:?DEPLOY_REF is required}"

            cd "${DEPLOY_PATH}"

            # Support deployments where repository is nested one level deeper.
            if [ ! -d .git ] && [ -d 24h_swim/.git ]; then
              cd 24h_swim
            fi

            if [ ! -d .git ]; then
              echo "DEPLOY_PATH does not contain a git repository: ${DEPLOY_PATH}"
              echo "Expected .git in ${DEPLOY_PATH} or ${DEPLOY_PATH}/24h_swim"
              exit 1
            fi

            git fetch --prune origin
            git checkout "${DEPLOY_REF}"
            if ! git pull --ff-only origin "${DEPLOY_REF}"; then
              echo "git pull failed. Common reason: uncommitted local changes on server."
              git status --short || true
              exit 1
            fi

            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml not found in $(pwd)"
              ls -la
              exit 1
            fi

            # Materialise .env from GitHub Secrets next to docker-compose.yml.
            # File is written atomically (tmp + mv) with owner-only perms so
            # in-flight reads never see a half-written file.
            umask 077
            tmp_env=".env.deploy.$$"
            : > "${tmp_env}"
            chmod 600 "${tmp_env}"
            emit() {
              # $1 = key, $2 = value. Skips empty values so docker-compose
              # defaults still apply. Values are written verbatim — docker
              # compose .env does not perform shell expansion on values.
              # Use `if` (not `&&`) so an empty value returns 0 and doesn't
              # trip `set -e` when this function is called at the top level.
              if [ -n "${2:-}" ]; then
                printf '%s=%s\n' "$1" "$2" >> "${tmp_env}"
              fi
            }
            emit MAILGUN_API_KEY  "${MAILGUN_API_KEY:-}"
            emit MAILGUN_DOMAIN   "${MAILGUN_DOMAIN:-}"
            emit MAILGUN_BASE_URL "${MAILGUN_BASE_URL:-}"
            emit MAILGUN_FROM     "${MAILGUN_FROM:-}"
            emit APP_URL          "${APP_URL:-}"
            mv -f "${tmp_env}" .env
            chmod 600 .env
            echo "Wrote .env with $(wc -l < .env) key(s) — values redacted in logs"

            if ! docker network inspect nginx-network >/dev/null 2>&1; then
              docker network create --subnet=10.200.0.0/24 nginx-network
            fi

            docker compose -f docker-compose.yml config >/dev/null
            docker compose -f docker-compose.yml up -d --build --remove-orphans
            docker compose -f docker-compose.yml ps
