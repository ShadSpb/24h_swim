# Security headers for the 24swim.de FRONTEND server block (nginx).
#
# Usage: copy this file to the server (e.g. /etc/nginx/snippets/) and add
#     include /etc/nginx/snippets/nginx-security-headers.conf;
# inside the `server { ... }` block that serves 24swim.de over HTTPS
# (the one with the `ssl_certificate` lines). Then:
#     nginx -t && systemctl reload nginx
#
# Do NOT include this in the api.24swim.de server block — the Flask backend
# already sends its own (stricter, JSON-appropriate) headers, and duplicate
# add_header directives would double them up.
#
# NOTE nginx pitfall: `add_header` directives are inherited from outer blocks
# ONLY if a location block defines none of its own. If your server block has a
# `location` that already uses add_header, repeat the include inside it.

# Force HTTPS for a year on this host. Add "includeSubDomains" only once you
# are sure EVERY subdomain (api., mg./smtp. web UIs, anything future) serves
# valid HTTPS — otherwise you can lock yourself out of one.
add_header Strict-Transport-Security "max-age=31536000" always;

# Content-Security-Policy, tailored to the built Vite app:
#   - scripts: self only (no inline scripts in the build, no CDNs) — this is
#     the strongest practical XSS mitigation for this site
#   - styles: self + inline (Radix/shadcn set inline style attributes) +
#     Google Fonts CSS (imported in src/index.css)
#   - fonts:  Google Fonts binaries
#   - images: self + data:/blob: (QR SVGs, logos, PDF/CSV data URIs)
#   - connect: the API subdomain
#   - no plugins, no framing by other sites, forms/base locked to self
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.24swim.de; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Legacy clickjacking protection (CSP frame-ancestors is the modern control;
# this covers older browsers).
add_header X-Frame-Options "DENY" always;

# Never let browsers MIME-sniff responses into executable types.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak page URLs to third parties (Google Fonts is the only one).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# This site needs none of the powerful browser APIs — say so explicitly.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
